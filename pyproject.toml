[project]
name = "assistente-ao-vivo"
version = "0.1.0"
description = "Assistente em tempo real para conversas: transcrição local com Whisper e sugestões do Claude."
requires-python = ">=3.12,<3.14"
dependencies = [
    "faster-whisper>=1.1.0",
    "anthropic>=2.7.0",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundcard>=0.4.3; sys_platform == 'win32'",
]

[tool.uv]
package = false
